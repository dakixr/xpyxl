name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pyright
        run: uv run pyright

      - name: Run pytest
        run: uv run pytest -q
